<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>QuickVerse Vendor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // PWA service worker (GUIDE.md §4.4) — installed PWAs get autoplay free.
      // HTTP interim: SW needs a secure context (https or localhost).
      // Skip silently on plain-LAN http so dashboard still works for 200 shops.
      (function () {
        try {
          var isSecure = window.isSecureContext === true;
          if ('serviceWorker' in navigator && isSecure) {
            window.addEventListener('load', function () {
              navigator.serviceWorker.register('./sw.js').catch(function () {});
            });
          }
        } catch (e) {}
      })();
    </script>
  </body>
</html>
